name: Deploy Calepin site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Install Calepin
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/vincentarelbundock/calepin/releases/latest/download/calepin-installer.sh \
            | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check versions
        run: |
          typst --version
          calepin --version

      - name: Build site
        run: |
          calepin compile . public
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4